[pytest]
pythonpath = .
asyncio_mode = auto
asyncio_default_test_loop_scope = session
asyncio_default_fixture_loop_scope = session
filterwarnings =
    # Targeted filter for upstream pytest-asyncio interacting with Python 3.14 event loop policy deprecation
    ignore:.*'asyncio.get_event_loop_policy' is deprecated and slated for removal.*:DeprecationWarning:pytest_asyncio
    ignore:.*'asyncio.set_event_loop_policy' is deprecated and slated for removal.*:DeprecationWarning:pytest_asyncio
    # Targeted filter for Starlette internal exception handler deprecation
    ignore:.*'HTTP_422_UNPROCESSABLE_ENTITY' is deprecated.*:starlette.exceptions.StarletteDeprecationWarning
